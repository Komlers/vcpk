<!DOCTYPE html>
<html lang="zh"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>404 · 词汇擂台</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="style.css">
<style>
  .nf{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;padding:40px 20px;}
  .nf .code{font-size:120px;font-weight:900;line-height:1;margin-bottom:10px;
            background:linear-gradient(135deg,var(--red),var(--blue));
            -webkit-background-clip:text;background-clip:text;color:transparent;}
  .nf .msg{font-size:26px;color:var(--ink2);margin-bottom:8px;font-weight:700;}
  .nf .sub{font-size:20px;color:var(--muted);margin-bottom:36px;}
</style>
</head>
<body>
<div class="nf">
  <div class="code">404</div>
  <div class="msg">这个页面走丢了</div>
  <div class="sub">你访问的路径不存在，回到擂台继续 PK 吧</div>
  <a href="/" class="startBtn small" style="text-decoration:none">返回主页</a>
</div>
</body>
</html>
